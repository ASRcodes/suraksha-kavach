import org.gradle.api.artifacts.component.ModuleComponentIdentifier
gradle.projectsEvaluated {
    rootProject.tasks.register("dependencyInventory") {
        doLast {
            def rows = new TreeSet<String>()
            [":app", ":core"].each { projectPath ->
                def target = rootProject.project(projectPath)
                target.configurations.findAll { it.canBeResolved && (
                    it.name in ["debugRuntimeClasspath", "releaseRuntimeClasspath", "debugAndroidTestRuntimeClasspath",
                                "debugUnitTestRuntimeClasspath", "runtimeClasspath", "testRuntimeClasspath"] ||
                    it.name.toLowerCase().startsWith("ksp") && it.name.endsWith("ProcessorClasspath"))
                }.each { configuration ->
                    configuration.incoming.resolutionResult.allComponents.each { component ->
                        if (component.id instanceof ModuleComponentIdentifier) {
                            def id = component.id
                            rows.add(projectPath + "\t" + configuration.name + "\t" + id.group + ":" + id.module + "\t" + id.version)
                        }
                    }
                }
            }
            def output = new File(rootProject.projectDir, "docs/DEPENDENCIES.tsv")
            output.parentFile.mkdirs()
            output.setText("project\tconfiguration\tmodule\tversion\n" + rows.join("\n") + "\n", "UTF-8")
            println("Wrote dependency inventory (" + rows.size() + " resolved entries)")
        }
    }
}
