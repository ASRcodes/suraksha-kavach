name: Android and model checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:assembleDebugAndroidTest :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: suraksha-kavach-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare device-test APKs
        run: |
          mkdir -p artifacts/device-apks
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/device-apks/
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/device-apks/
      - uses: actions/upload-artifact@v4
        with:
          name: device-test-apks
          path: artifacts/device-apks/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            core/build/reports/
            app/build/reports/
  device:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: device-test-apks
          path: device-apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android API ${{ matrix.api }} offline device checks
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          avd-name: Suraksha_API${{ matrix.api }}_CI
          ram-size: 3072M
          cores: 2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            python3 tools/check_device.py emulator-5554 --app-apk device-apks/app-debug.apk --test-apk device-apks/app-debug-androidTest.apk --large-font --native-sms
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-api-${{ matrix.api }}-device-reports
          path: artifacts/
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: python -m pip install -r ml/requirements.txt
      - run: python -m unittest discover -s ml/tests -v
